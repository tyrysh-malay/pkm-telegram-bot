name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  COMPOSE_PROJECT_NAME: pkm-ci-${{ github.run_id }}-${{ github.run_attempt }}
  ENVIRONMENT: ci
  POSTGRES_USER: pkm_ci
  POSTGRES_PASSWORD: pkm_ci_password
  POSTGRES_DB: pkm
  DATABASE_URL: postgresql+asyncpg://pkm_ci:pkm_ci_password@postgres:5432/pkm
  TEST_DATABASE_URL: postgresql+asyncpg://pkm_ci:pkm_ci_password@postgres:5432/pkm_test
  TELEGRAM_BOT_ENABLED: "false"
  TELEGRAM_BOT_TOKEN: ""
  TELEGRAM_ALLOWED_USER_IDS: "[]"
  TASK_DISPATCHER_ENABLED: "false"
  REDIS_URL: redis://redis:6379/0
  KNOWLEDGE_BASE_PATH: /var/tmp/pkm-ci-knowledge-base
  OPENAI_API_KEY: ""

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Select source commit and patch range
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "base_sha=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "head_sha=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "base_sha=$PUSH_BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "head_sha=$PUSH_HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out selected source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source commit and patch integrity
        env:
          BASE_SHA: ${{ steps.source.outputs.base_sha }}
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          echo "Selected source SHA: $HEAD_SHA"
          echo "Checked-out source SHA: $actual_sha"
          test "$actual_sha" = "$HEAD_SHA"

          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            empty_tree="$(git hash-object -t tree /dev/null)"
            git diff --check "$empty_tree" "$HEAD_SHA"
          else
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          fi

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build development app image
        run: docker compose build app

      - name: Start PostgreSQL
        run: docker compose up -d --wait --wait-timeout 90 postgres

      - name: Run authoritative pytest suite
        run: |
          docker compose run --rm -T --no-deps \
            -e ENVIRONMENT=ci \
            -e TASK_DISPATCHER_ENABLED=false \
            -e TELEGRAM_BOT_ENABLED=false \
            -e TELEGRAM_BOT_TOKEN= \
            -e TELEGRAM_ALLOWED_USER_IDS='[]' \
            -e OPENAI_API_KEY= \
            -e KNOWLEDGE_BASE_PATH=/var/tmp/pkm-ci-knowledge-base \
            app python -m pytest

      - name: Show failure diagnostics
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color postgres || true

      - name: Clean up Docker Compose resources
        if: always()
        run: docker compose down -v --remove-orphans
