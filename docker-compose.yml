services:
  app:
    image: pkm-telegram-bot:local
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "PKM Telegram Bot"
      ENVIRONMENT: "development"
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://pkm:pkm@postgres:5432/pkm}"
      TEST_DATABASE_URL: "${TEST_DATABASE_URL:-postgresql+asyncpg://pkm:pkm@postgres:5432/pkm_test}"
      TELEGRAM_BOT_ENABLED: "${TELEGRAM_BOT_ENABLED:-false}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      KNOWLEDGE_BASE_PATH: "${KNOWLEDGE_BASE_PATH:-knowledge-base}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      TASK_DISPATCHER_ENABLED: "true"
    volumes:
      - ./knowledge-base:/app/knowledge-base

  worker:
    image: pkm-telegram-bot:local
    command: ["dramatiq", "app.worker.tasks", "--processes", "1", "--threads", "1"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://pkm:pkm@postgres:5432/pkm}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      KNOWLEDGE_BASE_PATH: "${KNOWLEDGE_BASE_PATH:-knowledge-base}"
    volumes:
      - ./knowledge-base:/app/knowledge-base

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-pkm}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-pkm}"
      POSTGRES_DB: "${POSTGRES_DB:-pkm}"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
