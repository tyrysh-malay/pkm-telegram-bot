services:
  app:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "PKM Telegram Bot"
      ENVIRONMENT: "development"
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://pkm:pkm@postgres:5432/pkm}"
      TEST_DATABASE_URL: "${TEST_DATABASE_URL:-postgresql+asyncpg://pkm:pkm@postgres:5432/pkm_test}"
      TELEGRAM_BOT_ENABLED: "${TELEGRAM_BOT_ENABLED:-false}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
    volumes:
      - ./knowledge-base:/app/knowledge-base

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-pkm}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-pkm}"
      POSTGRES_DB: "${POSTGRES_DB:-pkm}"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
